spring.application.name=shortener-service
spring.datasource.url=${SHORTENER_DB_URL:jdbc:h2:file:./data/shortener}
spring.datasource.username=${SHORTENER_DB_USERNAME:sa}
spring.datasource.password=${SHORTENER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false
shortener.public-base-url=${SHORTENER_PUBLIC_BASE_URL:http://localhost:8080}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
